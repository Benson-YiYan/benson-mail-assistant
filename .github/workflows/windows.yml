name: Windows build and verification
on:
  push:
    branches: [main]
    paths: ["windows/**", ".github/workflows/windows.yml"]
  pull_request:
    paths: ["windows/**", ".github/workflows/windows.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 25
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          global-json-file: windows/global.json
      - name: Dependencies
        run: python -m pip install -r requirements.txt "trustme>=1.2,<2" "pywinauto>=0.6.9,<0.7"
      - name: Parse PowerShell helpers without contacting services
        run: |
          $tokens = $null
          $parseErrors = $null
          foreach ($script in @('docs/Get-Outlook-Token.ps1', 'installer/prerequisites.ps1', 'script/check_prerequisites.ps1')) {
            $ast = [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script), [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          }
          if (!(Test-Path 'docs/Get-Outlook-Token.bat')) { throw 'Missing OAuth2 BAT entry point' }
          New-Item -ItemType Directory -Force evidence | Out-Null
          @{ ok = $true; parse_errors = $parseErrors.Count; network_requests = 0 } | ConvertTo-Json | Set-Content evidence/oauth-helper-parse.json
      - name: Installer compiler preflight with a tiny payload
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force evidence | Out-Null
          $tiny = Join-Path $env:RUNNER_TEMP 'BensonMail-installer-preflight-payload'
          New-Item -ItemType Directory -Force (Join-Path $tiny '_internal') | Out-Null
          foreach ($name in @('BensonMail-200001010000.exe', 'Uninstall-BensonMail-200001010000.exe', 'MailWorker.exe')) {
            Set-Content -LiteralPath (Join-Path $tiny $name) -Value 'synthetic compiler preflight only' -Encoding ascii
          }
          @{ runtimeOptions = @{ tfm = 'net8.0'; framework = @{ name = 'Microsoft.NETCore.App'; version = '8.0.32' }; rollForward = 'LatestPatch' } } |
            ConvertTo-Json -Depth 4 | Set-Content -LiteralPath (Join-Path $tiny 'BensonMail.runtimeconfig.json') -Encoding utf8
          try {
            ./script/build_installer.ps1 -PackageDir $tiny -Version '200001010000' 2>&1 | Tee-Object evidence/installer-preflight.txt
            if ($LASTEXITCODE -ne 0) { throw 'Installer compiler preflight failed' }
          } finally {
            Remove-Item -LiteralPath $tiny -Recurse -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath 'dist/BensonMail-Windows-x64-Setup-200001010000.exe' -Force -ErrorAction SilentlyContinue
          }
      - name: Configure screenshot font smoothing
        run: ./script/configure_test_desktop.ps1
      - name: Unit tests
        run: |
          New-Item -ItemType Directory -Force evidence | Out-Null
          python -m unittest discover -s tests -v 2>&1 | Tee-Object evidence/unit-tests.txt
          if ($LASTEXITCODE -ne 0) { throw 'Unit tests failed' }
      - name: Source application UI and platform self-test
        run: |
          python main.py --self-test evidence/source-result.json --screenshot evidence/source-screen.png
          if ($LASTEXITCODE -ne 0) { throw 'Source self-test failed' }
          if (!(Get-Content evidence/source-result.json -Raw | ConvertFrom-Json).ok) { throw 'Source result failed' }
      - name: Load recorded legacy release fingerprints and size baseline
        run: ./script/prepare_legacy_baseline.ps1
      - name: Build standalone application
        run: ./build.ps1
      - name: Verify prerequisite consent and provision missing shared runtimes
        run: |
          $setup = (Get-ChildItem dist -Filter 'BensonMail-Windows-x64-Setup-*.exe' | Select-Object -First 1).FullName
          powershell -NoProfile -ExecutionPolicy Bypass -File script/check_prerequisites.ps1 -Evidence evidence -Setup "$setup" -ProvisionSharedRuntimes
          if ($LASTEXITCODE -ne 0) { throw 'Prerequisite detection, consent or official runtime provisioning failed' }
          if (!(Get-Content evidence/prerequisites-result.json -Raw | ConvertFrom-Json).ok) { throw 'Missing prerequisite verification result' }
      - name: Measure installed payload reduction
        run: |
          $package = Get-ChildItem dist -Directory | Where-Object Name -Match '^BensonMail-\d{12}$' | Select-Object -First 1
          python script/measure_package.py $package.FullName evidence/package-size-result.json --baseline evidence/package-size-baseline.json
          if ($LASTEXITCODE -ne 0) { throw 'Package size verification failed' }
      - name: Public update manifest over verified Windows HTTPS
        run: |
          $exe = (Get-ChildItem dist -Recurse -Filter 'BensonMail-*.exe' | Where-Object Name -Match '^BensonMail-\d{12}\.exe$' | Select-Object -First 1).FullName
          $result = Join-Path $PWD 'evidence/update-network-result.json'
          $process = Start-Process -FilePath $exe -ArgumentList @('--update-network-test', "`"$result`"") -PassThru -WindowStyle Hidden
          if (!$process.WaitForExit(45000)) { Stop-Process -Id $process.Id -Force; throw 'Public update manifest probe timed out' }
          Get-Content $result
          if ($process.ExitCode -ne 0 -or !(Get-Content $result -Raw | ConvertFrom-Json).ok) { throw 'Verified public update manifest probe failed' }
      - name: Packaged EXE self-test with timeout
        run: |
          $result = Join-Path $PWD 'evidence/packaged-result.json'
          $screen = Join-Path $PWD 'evidence/packaged-screen.png'
          $exe = (Get-ChildItem dist -Recurse -Filter 'BensonMail-*.exe' | Where-Object Name -Match '^BensonMail-\d{12}\.exe$' | Select-Object -First 1).FullName
          $process = Start-Process -FilePath $exe -ArgumentList @('--self-test', "`"$result`"", '--screenshot', "`"$screen`"") -PassThru
          if (!$process.WaitForExit(120000)) { Stop-Process -Id $process.Id -Force; throw 'Packaged EXE timed out' }
          if ($process.ExitCode -ne 0) {
            Get-WinEvent -FilterHashtable @{LogName='Application'; StartTime=(Get-Date).AddMinutes(-5)} -ErrorAction SilentlyContinue |
              Select-Object -First 8 TimeCreated,ProviderName,Message |
              ConvertTo-Json -Depth 3 | Set-Content evidence/native-crash-events.json
            throw "Packaged EXE failed: $($process.ExitCode)"
          }
          if (!(Test-Path $result)) { throw 'Missing packaged self-test evidence' }
          if (!(Get-Content $result -Raw | ConvertFrom-Json).ok) { throw 'Packaged result failed' }
          if (!(Test-Path $screen)) { throw 'Missing screenshot' }
          $runtimeResult = Join-Path $PWD 'evidence/worker-runtime-result.json'
          $worker = Join-Path (Split-Path $exe) 'MailWorker.exe'
          $runtimeProcess = Start-Process -FilePath $worker -ArgumentList @('--runtime-self-test', "`"$runtimeResult`"") -PassThru -WindowStyle Hidden
          if (!$runtimeProcess.WaitForExit(60000)) { Stop-Process -Id $runtimeProcess.Id -Force; throw 'Slim frozen worker test timed out' }
          if ($runtimeProcess.ExitCode -ne 0 -or !(Test-Path $runtimeResult)) { throw 'Slim frozen worker test failed' }
          if (!(Get-Content $runtimeResult -Raw | ConvertFrom-Json).ok) { throw 'Slim worker attachment/TLS/DPAPI test failed' }
          $harnessResult = Join-Path $PWD 'evidence/harness-result.json'
          $worker = Join-Path (Split-Path $exe) 'MailWorker.exe'
          $harnessProcess = Start-Process -FilePath $worker -ArgumentList @('--harness-self-test', "`"$harnessResult`"") -PassThru -WindowStyle Hidden
          if (!$harnessProcess.WaitForExit(60000)) { Stop-Process -Id $harnessProcess.Id -Force; throw 'Packaged Harness test timed out' }
          if ($harnessProcess.ExitCode -ne 0 -or !(Test-Path $harnessResult)) { throw 'Packaged Harness runtime failed' }
          if (!(Get-Content $harnessResult -Raw | ConvertFrom-Json).ok) { throw 'Packaged Harness result failed' }
          $uninstaller = (Get-ChildItem dist -Recurse -Filter 'Uninstall-BensonMail-*.exe' | Select-Object -First 1).FullName
          $uninstallResult = Join-Path $PWD 'evidence/uninstall-result.json'
          $uninstallProcess = Start-Process -FilePath $uninstaller -ArgumentList @('--uninstall-ui-test', "`"$uninstallResult`"") -PassThru
          if (!$uninstallProcess.WaitForExit(30000)) { Stop-Process -Id $uninstallProcess.Id -Force; throw 'Uninstaller UI test timed out' }
          if ($uninstallProcess.ExitCode -ne 0) {
            Get-WinEvent -FilterHashtable @{LogName='Application'; StartTime=(Get-Date).AddMinutes(-5)} -ErrorAction SilentlyContinue |
              Select-Object -First 8 TimeCreated,ProviderName,Message |
              ConvertTo-Json -Depth 3 | Set-Content evidence/uninstall-crash-events.json
            throw "Uninstaller UI test failed: $($uninstallProcess.ExitCode)"
          }
          if (!(Get-Content $uninstallResult -Raw | ConvertFrom-Json).ok) { throw 'Uninstaller UI result failed' }
          $programDir = Split-Path $exe
          python script/check_packaged_uninstall.py "$programDir" evidence/uninstall-e2e-result.json
          if ($LASTEXITCODE -ne 0) { throw 'Independent uninstall integration test failed' }
      - name: Installer choices and complete cleanup integration test
        run: |
          $setup = (Get-ChildItem dist -Filter 'BensonMail-Windows-x64-Setup-*.exe' | Select-Object -First 1).FullName
          python script/check_installer.py "$setup" evidence
          if ($LASTEXITCODE -ne 0) { throw 'Installer integration test failed' }
          python script/check_installer_cleanup_ui.py "$setup" evidence
          if ($LASTEXITCODE -ne 0) { throw 'Installer cleanup UI integration test failed' }
      - name: Real update handoff from synthetic legacy installation
        run: |
          $package = Get-ChildItem dist -Directory | Where-Object Name -Match '^BensonMail-\d{12}$' | Select-Object -First 1
          $setup = (Get-ChildItem dist -Filter 'BensonMail-Windows-x64-Setup-*.exe' | Select-Object -First 1).FullName
          python script/check_update_handoff.py $package.FullName "$setup" evidence
          if ($LASTEXITCODE -ne 0) { throw 'Real installed update handoff failed' }
      - name: Upload verified Windows package
        uses: actions/upload-artifact@v4
        with:
          name: BensonMail-Windows-x64
          path: windows/dist/BensonMail-Windows-x64-Setup-*.exe
          if-no-files-found: error
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-test-evidence
          path: windows/evidence/
          if-no-files-found: warn
