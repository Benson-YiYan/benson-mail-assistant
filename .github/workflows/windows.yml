name: Windows build and verification
on:
  push:
    branches: [main, build/windows-app]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: python -m pip install -r requirements.txt
      - name: Unit tests
        run: |
          New-Item -ItemType Directory -Force evidence | Out-Null
          python -m unittest discover -s tests -v 2>&1 | Tee-Object evidence/unit-tests.txt
          if ($LASTEXITCODE -ne 0) { throw 'Unit tests failed' }
      - name: Source application UI and platform self-test
        run: |
          python main.py --self-test evidence/source-result.json --screenshot evidence/source-screen.png
          if ($LASTEXITCODE -ne 0) { throw 'Source self-test failed' }
          if (!(Get-Content evidence/source-result.json -Raw | ConvertFrom-Json).ok) { throw 'Source result failed' }
      - name: Build standalone application
        run: ./build.ps1
      - name: Packaged EXE self-test with timeout
        run: |
          $result = Join-Path $PWD 'evidence/packaged-result.json'
          $screen = Join-Path $PWD 'evidence/packaged-screen.png'
          $process = Start-Process -FilePath dist/BensonMail/BensonMail.exe -ArgumentList @('--self-test', "`"$result`"", '--screenshot', "`"$screen`"") -PassThru
          if (!$process.WaitForExit(120000)) { Stop-Process -Id $process.Id -Force; throw 'Packaged EXE timed out' }
          if ($process.ExitCode -ne 0) { throw "Packaged EXE failed: $($process.ExitCode)" }
          if (!(Test-Path $result)) { throw 'Missing packaged self-test evidence' }
          if (!(Get-Content $result -Raw | ConvertFrom-Json).ok) { throw 'Packaged result failed' }
          if (!(Test-Path $screen)) { throw 'Missing screenshot' }
      - name: Upload verified Windows package
        uses: actions/upload-artifact@v4
        with:
          name: BensonMail-Windows-x64
          path: dist/BensonMail-Windows-x64.zip
          if-no-files-found: error
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-test-evidence
          path: evidence/
          if-no-files-found: warn
